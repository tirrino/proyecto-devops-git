apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-yaml
  namespace: laboratorio-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-yaml
  template:
    metadata:
      labels:
        app: demo-yaml
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
